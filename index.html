<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a73e8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="旅遊助手">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.svg">
    <title>旅遊助手</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- User Select Screen -->
        <div id="user-select-screen" class="user-select-screen">
            <div class="user-select-box">
                <h2>🗺️ 旅遊助手</h2>
                <p>選擇你的身份</p>
                <div id="user-list" class="user-list">
                    <p class="hint">載入中...</p>
                </div>
            </div>
        </div>

        <!-- Pull to refresh indicator -->
        <div id="pull-indicator" class="pull-indicator">
            <span>↓ 下拉更新</span>
        </div>

        <!-- Header -->
        <header class="app-header" style="display:none;">
            <h1>🗺️ 旅遊助手</h1>
            <div class="header-actions">
                <span id="current-user-name" class="current-user-badge"></span>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Now Tab -->
            <section id="tab-now" class="tab-content active">
                <div class="current-info">
                    <div class="time-display">
                        <span id="current-time"></span>
                        <span id="current-date"></span>
                    </div>
                    <div id="current-location" class="location-display">
                        📍 取得位置中...
                    </div>
                    <div id="current-weather" class="weather-display" style="display:none;"></div>
                </div>

                <div id="current-activity" class="card highlight-card">
                    <div class="card-label">現在行程</div>
                    <div class="card-content">
                        <h2 id="now-place">載入中...</h2>
                        <p id="now-time-range"></p>
                        <p id="now-notes"></p>
                    </div>
                    <button id="navigate-now" class="nav-btn">🧭 導航到這裡</button>
                </div>

                <div id="next-activity" class="card">
                    <div class="card-label">下一站</div>
                    <div class="card-content">
                        <h2 id="next-place">-</h2>
                        <p id="next-time-range"></p>
                        <p id="next-notes"></p>
                    </div>
                    <button id="navigate-next" class="nav-btn">🧭 導航到這裡</button>
                </div>
            </section>

            <!-- Timeline Tab -->
            <section id="tab-timeline" class="tab-content">
                <div class="date-selector">
                    <button id="prev-day" class="icon-btn">◀</button>
                    <label class="date-label-picker">
                        <span id="selected-date"></span>
                        <input type="date" id="timeline-date-picker" class="hidden-date-picker">
                    </label>
                    <button id="next-day" class="icon-btn">▶</button>
                </div>
                <div id="timeline-list" class="timeline">
                </div>
            </section>

            <!-- Explore Tab (美食 + 景點 合併) -->
            <section id="tab-explore" class="tab-content">
                <div class="explore-toggle">
                    <button class="explore-toggle-btn active" data-explore="food">🍽️ 美食</button>
                    <button class="explore-toggle-btn" data-explore="places">📸 景點</button>
                </div>

                <!-- Food sub-section -->
                <div id="explore-food" class="explore-section active">
                    <div class="random-header">
                        <div class="category-filters" id="food-category-filters">
                            <button class="filter-btn active" data-category="all">全部</button>
                        </div>
                        <button id="food-shuffle-btn" class="action-btn">🎲 隨機挑一家</button>
                    </div>
                    <div id="food-pick" class="card highlight-card" style="display:none;">
                        <div class="card-label">🎯 今天就吃這個</div>
                        <div class="card-content">
                            <h2 id="food-pick-name"></h2>
                            <p id="food-pick-type"></p>
                            <p id="food-pick-notes"></p>
                        </div>
                        <button id="navigate-food-pick" class="nav-btn">🧭 導航到這裡</button>
                    </div>
                    <div id="food-list" class="place-list">
                    </div>
                </div>

                <!-- Places sub-section -->
                <div id="explore-places" class="explore-section">
                    <div class="random-header">
                        <div class="category-filters" id="category-filters">
                            <button class="filter-btn active" data-category="all">全部</button>
                        </div>
                        <button id="shuffle-btn" class="action-btn">🎲 隨機推薦一個</button>
                    </div>
                    <div id="random-pick" class="card highlight-card" style="display:none;">
                        <div class="card-label">🎯 推薦你去</div>
                        <div class="card-content">
                            <h2 id="random-place"></h2>
                            <p id="random-type"></p>
                            <p id="random-notes"></p>
                        </div>
                        <button id="navigate-random" class="nav-btn">🧭 導航到這裡</button>
                    </div>
                    <div id="random-list" class="place-list">
                    </div>
                </div>
            </section>

            <!-- AI Tab -->
            <section id="tab-ai" class="tab-content">
                <div class="ai-chat">
                    <div id="ai-messages" class="ai-messages">
                        <div class="ai-message bot">
                            <p>嗨！我是你的旅遊 AI 助手 🤖</p>
                            <p>你可以用打字、語音或拍照跟我互動：</p>
                        </div>
                    </div>
                    <!-- Quick Actions -->
                    <div class="ai-quick-actions">
                        <button class="ai-quick-btn" data-action="recommend">🍽️ 推薦吃的</button>
                        <button class="ai-quick-btn" data-action="translate">🎌 翻譯對話</button>
                        <button class="ai-quick-btn" data-action="identify">🏯 這是什麼</button>
                    </div>
                    <div class="ai-input-area">
                        <label for="ai-image-input" class="ai-image-btn" title="拍照翻譯/辨識">📷</label>
                        <input type="file" id="ai-image-input" accept="image/*" capture="environment" style="display:none;">
                        <input type="text" id="ai-input" placeholder="打字或拍照翻譯..." autocomplete="off">
                        <button id="ai-voice" class="ai-voice-btn" title="語音輸入">🎙️</button>
                        <button id="ai-send" class="ai-send-btn">➤</button>
                    </div>
                </div>
            </section>

            <!-- More Tab (選單列表) -->
            <section id="tab-more" class="tab-content">
                <div class="more-menu">
                    <div class="more-menu-item" data-page="schedule-manage">
                        <span class="more-icon">📝</span>
                        <span class="more-label">行程管理</span>
                        <span class="more-arrow">›</span>
                    </div>
                    <div class="more-menu-item" data-page="currency">
                        <span class="more-icon">💱</span>
                        <span class="more-label">匯率快算</span>
                        <span class="more-arrow">›</span>
                    </div>
                    <div class="more-menu-item" data-page="packing">
                        <span class="more-icon">🧳</span>
                        <span class="more-label">行李清單</span>
                        <span class="more-arrow">›</span>
                    </div>
                    <div class="more-menu-item" data-page="emergency">
                        <span class="more-icon">🆘</span>
                        <span class="more-label">緊急資訊</span>
                        <span class="more-arrow">›</span>
                    </div>
                    <div class="more-menu-item" data-page="trip-dates">
                        <span class="more-icon">✈️</span>
                        <span class="more-label">旅程日期</span>
                        <span class="more-arrow">›</span>
                    </div>
                    <div class="more-menu-item" data-page="settings">
                        <span class="more-icon">⚙️</span>
                        <span class="more-label">設定</span>
                        <span class="more-arrow">›</span>
                    </div>
                </div>
                <p class="hint" style="text-align:center;margin-top:16px;">版本 v2-35</p>

                <!-- Sub-pages (hidden by default) -->
                <div id="more-subpage" class="more-subpage" style="display:none;">
                    <button class="back-btn" id="more-back">← 返回</button>
                    <div id="more-subpage-content"></div>
                </div>
            </section>
        </main>

        <!-- Bottom Tab Bar -->
        <nav class="bottom-tab-bar" style="display:none;">
            <button class="bottom-tab active" data-tab="now">
                <span class="bottom-tab-icon">🏠</span>
                <span class="bottom-tab-label">現在</span>
            </button>
            <button class="bottom-tab" data-tab="timeline">
                <span class="bottom-tab-icon">📅</span>
                <span class="bottom-tab-label">時間軸</span>
            </button>
            <button class="bottom-tab" data-tab="explore">
                <span class="bottom-tab-icon">🔍</span>
                <span class="bottom-tab-label">探索</span>
            </button>
            <button class="bottom-tab" data-tab="ai">
                <span class="bottom-tab-icon">🤖</span>
                <span class="bottom-tab-label">AI</span>
            </button>
            <button class="bottom-tab" data-tab="more">
                <span class="bottom-tab-icon">☰</span>
                <span class="bottom-tab-label">更多</span>
            </button>
        </nav>

        <!-- Loading -->
        <div id="loading" class="loading-overlay" style="display:none;">
            <div class="spinner"></div>
            <p>載入資料中...</p>
        </div>
    </div>

    <!-- Sub-page templates (hidden) -->
    <template id="tpl-currency">
        <div class="tool-section">
            <div class="tool-header">💱 匯率快算</div>
            <div class="currency-converter">
                <div class="currency-row">
                    <input type="number" id="jpy-input" placeholder="0" inputmode="numeric">
                    <span class="currency-label">¥ 日幣</span>
                </div>
                <div class="currency-arrow">↕</div>
                <div class="currency-row">
                    <input type="number" id="twd-input" placeholder="0" inputmode="numeric">
                    <span class="currency-label">$ 台幣</span>
                </div>
                <div class="currency-rate">
                    <span>匯率：1 JPY = </span>
                    <input type="number" id="rate-input" step="0.001" value="0.22">
                    <span> TWD</span>
                    <button id="fetch-rate" class="tool-btn-sm">更新匯率</button>
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-packing">
        <div class="tool-section">
            <div class="tool-header">🧳 行李清單</div>
            <div id="packing-list" class="packing-list">
                <p class="hint">載入中...</p>
            </div>
            <div class="packing-progress">
                <span id="packing-progress-text">0/0</span>
                <div class="progress-bar">
                    <div class="progress-fill" id="packing-progress-bar"></div>
                </div>
            </div>
            <button id="add-packing-btn" class="action-btn" style="width:100%;margin-top:12px;">＋ 新增物品</button>
            <div id="packing-form" class="schedule-form" style="display:none;margin-top:12px;">
                <div class="form-row">
                    <div class="form-group" style="flex:2;">
                        <label>物品名稱</label>
                        <input type="text" id="packing-item-name" placeholder="物品名稱">
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label>分類</label>
                        <input type="text" id="packing-item-category" placeholder="分類">
                    </div>
                </div>
                <div class="form-actions">
                    <button id="packing-cancel" class="tool-btn" style="background:var(--text-secondary);">取消</button>
                    <button id="packing-save" class="tool-btn">儲存</button>
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-emergency">
        <div class="tool-section">
            <div class="tool-header">🆘 緊急資訊</div>
            <div id="emergency-current-segment" class="emergency-segment-info" style="display:none;"></div>
            <div class="emergency-list">
                <div class="emergency-item">
                    <span class="emergency-label">台灣駐日辦事處</span>
                    <a href="tel:+81-3-6206-0066" class="emergency-value">+81-3-6206-0066</a>
                </div>
                <div class="emergency-item">
                    <span class="emergency-label">日本報警</span>
                    <a href="tel:110" class="emergency-value">110</a>
                </div>
                <div class="emergency-item">
                    <span class="emergency-label">日本救護車</span>
                    <a href="tel:119" class="emergency-value">119</a>
                </div>
            </div>
            <div id="emergency-all-hotels" style="margin-top:16px;"></div>
        </div>
    </template>

    <template id="tpl-trip-dates">
        <div class="tool-section">
            <div class="tool-header">✈️ 旅程日期</div>
            <div class="countdown-box">
                <span class="countdown-number" id="countdown-number">-</span>
                <span class="countdown-label" id="countdown-label">設定出發日期</span>
            </div>
            <div class="countdown-settings">
                <div class="countdown-row">
                    <label>出發日</label>
                    <input type="date" id="trip-start-date">
                </div>
                <div class="countdown-row">
                    <label>回程日</label>
                    <input type="date" id="trip-end-date">
                </div>
                <button id="save-trip-dates" class="tool-btn" style="width:100%;">修改</button>
            </div>
        </div>

        <!-- Segments -->
        <div class="tool-section">
            <div class="tool-header">📍 旅途設定</div>
            <p class="hint" style="margin-bottom:12px;">設定旅程的國家、城市、住宿資訊</p>
            <div id="segments-list" class="segments-list">
                <p class="hint">載入中...</p>
            </div>
            <button id="add-segment-btn" class="action-btn" style="width:100%;margin-top:12px;">＋ 新增旅途</button>

            <div id="segment-form" class="schedule-form" style="display:none;margin-top:12px;">
                <div class="tool-header" id="segment-form-title">新增旅途</div>
                <div class="form-group"><label>旅程名稱</label><input type="text" id="seg-name" placeholder="例：東京自由行"></div>
                <div class="form-group">
                    <label>國家</label>
                    <select id="seg-country">
                        <option value="">選擇國家</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>城市</label>
                    <select id="seg-city">
                        <option value="">先選擇國家</option>
                    </select>
                    <input type="text" id="seg-city-custom" placeholder="輸入城市名稱" style="display:none;margin-top:6px;">
                </div>
                <div class="form-group"><label>開始日</label><input type="date" id="seg-start"></div>
                <div class="form-group"><label>結束日</label><input type="date" id="seg-end"></div>
                <div class="form-group"><label>住宿名稱</label><input type="text" id="seg-hotel-name" placeholder="飯店名稱"></div>
                <div class="form-group"><label>住宿地址</label><input type="text" id="seg-hotel-address" placeholder="完整地址"></div>
                <div class="form-group"><label>住宿電話</label><input type="text" id="seg-hotel-phone" placeholder="+81-3-xxxx"></div>
                <div class="form-actions">
                    <button id="seg-cancel" class="tool-btn" style="background:var(--text-secondary);">取消</button>
                    <button id="seg-save" class="tool-btn">儲存</button>
                </div>
            </div>
        </div>

        <!-- Weather -->
        <div class="tool-section" id="trip-weather-section" style="display:none;">
            <div class="tool-header">🌤️ 旅程天氣</div>
            <div id="weather-alert" class="weather-alert" style="display:none;"></div>
            <div id="trip-weather-list" class="weather-list"></div>
        </div>
    </template>

    <template id="tpl-schedule-manage">
        <div class="tool-section">
            <div class="tool-header">📝 行程管理</div>
            <div id="sync-status" class="sync-status" style="display:none;"></div>
            <div id="sync-actions" style="display:none;margin-bottom:12px;">
                <button class="tool-btn-sm" onclick="retrySyncQueue()">🔄 重試同步</button>
                <button class="tool-btn-sm" onclick="clearSyncQueue()" style="margin-left:8px;">🗑️ 清除</button>
            </div>
            <div class="schedule-date-selector">
                <button class="icon-btn" id="sched-prev-day">◀</button>
                <label class="date-label-picker">
                    <span id="sched-selected-date"></span>
                    <input type="date" id="sched-date-picker" class="hidden-date-picker">
                </label>
                <button class="icon-btn" id="sched-next-day">▶</button>
            </div>
            <div id="schedule-edit-list" class="schedule-edit-list">
            </div>
            <button id="add-schedule-btn" class="action-btn" style="width:100%;margin-top:12px;">＋ 新增行程</button>
        </div>

        <!-- Edit Form (hidden by default) -->
        <div id="schedule-form" class="schedule-form" style="display:none;">
            <div class="tool-header" id="schedule-form-title">新增行程</div>
            <div class="form-group">
                <label>日期</label>
                <input type="date" id="sched-date">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>開始時間</label>
                    <input type="time" id="sched-start">
                </div>
                <div class="form-group">
                    <label>結束時間</label>
                    <input type="time" id="sched-end">
                </div>
            </div>
            <div class="form-group">
                <label>地點</label>
                <input type="text" id="sched-place" placeholder="地點名稱">
            </div>
            <div class="form-group">
                <label>地址</label>
                <input type="text" id="sched-address" placeholder="完整地址（導航用）">
            </div>
            <div class="form-group">
                <label>備註</label>
                <input type="text" id="sched-notes" placeholder="備註（選填）">
            </div>
            <div class="form-actions">
                <button id="sched-cancel" class="tool-btn" style="background:var(--text-secondary);">取消</button>
                <button id="sched-save" class="tool-btn">儲存</button>
            </div>
        </div>
    </template>

    <template id="tpl-settings">
        <div class="tool-section">
            <div class="tool-header">⚙️ 設定</div>
            <div class="setting-group">
                <label class="setting-label">字體大小</label>
                <div class="font-size-toggle">
                    <button class="font-size-btn" data-size="normal">正常</button>
                    <button class="font-size-btn" data-size="large">大</button>
                    <button class="font-size-btn" data-size="xlarge">特大</button>
                </div>
            </div>
            <div class="more-menu" style="margin-top:16px;">
                <div class="more-menu-item" onclick="switchUser()">
                    <span class="more-icon">👤</span>
                    <span class="more-label">切換用戶</span>
                    <span class="more-arrow">›</span>
                </div>
            </div>
        </div>
    </template>

    <script src="app.js"></script>
</body>
</html>
