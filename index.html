<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a73e8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="旅遊助手">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.svg">
    <title>旅遊助手</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="app-header">
            <h1>🗺️ 旅遊助手</h1>
            <button id="refresh-btn" class="icon-btn" title="重新整理">🔄</button>
        </header>

        <!-- Tab Navigation -->
        <nav class="tab-nav">
            <button class="tab-btn active" data-tab="now">現在</button>
            <button class="tab-btn" data-tab="timeline">時間軸</button>
            <button class="tab-btn" data-tab="food">美食</button>
            <button class="tab-btn" data-tab="random">探索</button>
        </nav>

        <!-- Now Tab -->
        <section id="tab-now" class="tab-content active">
            <div class="current-info">
                <div class="time-display">
                    <span id="current-time"></span>
                    <span id="current-date"></span>
                </div>
                <div id="current-location" class="location-display">
                    📍 取得位置中...
                </div>
            </div>

            <div id="current-activity" class="card highlight-card">
                <div class="card-label">現在行程</div>
                <div class="card-content">
                    <h2 id="now-place">載入中...</h2>
                    <p id="now-time-range"></p>
                    <p id="now-notes"></p>
                </div>
                <button id="navigate-now" class="nav-btn">🧭 導航到這裡</button>
            </div>

            <div id="next-activity" class="card">
                <div class="card-label">下一站</div>
                <div class="card-content">
                    <h2 id="next-place">-</h2>
                    <p id="next-time-range"></p>
                    <p id="next-notes"></p>
                </div>
                <button id="navigate-next" class="nav-btn">🧭 導航到這裡</button>
            </div>
        </section>

        <!-- Timeline Tab -->
        <section id="tab-timeline" class="tab-content">
            <div class="date-selector">
                <button id="prev-day" class="icon-btn">◀</button>
                <span id="selected-date"></span>
                <button id="next-day" class="icon-btn">▶</button>
            </div>
            <div id="timeline-list" class="timeline">
            </div>
        </section>

        <!-- Random Tab -->
        <section id="tab-random" class="tab-content">
            <div class="random-header">
                <p>想去哪一類的地方？選好再隨機！</p>
                <div class="category-filters" id="category-filters">
                    <button class="filter-btn active" data-category="all">全部</button>
                </div>
                <button id="shuffle-btn" class="action-btn">🎲 隨機推薦一個</button>
            </div>
            <div id="random-pick" class="card highlight-card" style="display:none;">
                <div class="card-label">🎯 推薦你去</div>
                <div class="card-content">
                    <h2 id="random-place"></h2>
                    <p id="random-type"></p>
                    <p id="random-notes"></p>
                </div>
                <button id="navigate-random" class="nav-btn">🧭 導航到這裡</button>
            </div>
            <div id="random-list" class="place-list">
            </div>
        </section>

        <!-- Food Tab -->
        <section id="tab-food" class="tab-content">
            <div class="random-header">
                <p>想吃什麼？選分類再隨機！</p>
                <div class="category-filters" id="food-category-filters">
                    <button class="filter-btn active" data-category="all">全部</button>
                </div>
                <button id="food-shuffle-btn" class="action-btn">🎲 隨機挑一家</button>
            </div>
            <div id="food-pick" class="card highlight-card" style="display:none;">
                <div class="card-label">🎯 今天就吃這個</div>
                <div class="card-content">
                    <h2 id="food-pick-name"></h2>
                    <p id="food-pick-type"></p>
                    <p id="food-pick-notes"></p>
                </div>
                <button id="navigate-food-pick" class="nav-btn">🧭 導航到這裡</button>
            </div>
            <div id="food-list" class="place-list">
            </div>
        </section>

        <!-- Loading -->
        <div id="loading" class="loading-overlay" style="display:none;">
            <div class="spinner"></div>
            <p>載入資料中...</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
